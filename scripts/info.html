<style>
__FONTCSS__

:root{
  --bg:#e9e9e9; --bg2:#fff; --panel:#f3f3f3; --panel2:#e2e2e2;
  --tx:#111; --tx2:#4a4a4a; --tx3:#767676;
  --line:#d6d6d6; --line2:#c4c4c4;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --title:"Planner Title",var(--sans);
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);

  --f-display:clamp(34px,5.2vw,52px);   --k-display:.008em;
  --f-h2:clamp(25px,3vw,34px);          --k-h2:.03em;
  --f-h3:clamp(20px,2.2vw,25px);        --k-h3:.02em;
  --f-title:17px;
  --f-body:16px;                        --k-body:.005em;
  --f-sub:15px;                         --k-sub:.008em;
  --f-label:14px;                       --k-label:.01em;
  --f-caption:13px;                     --k-caption:.02em;
}
:root[data-theme=dark]{
  --bg:#101010; --bg2:#191919; --panel:#1f1f1f; --panel2:#2a2a2a;
  --tx:#f2f2f2; --tx2:#b6b6b6; --tx3:#8b8b8b;
  --line:#2c2c2c; --line2:#3a3a3a;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#101010; --bg2:#191919; --panel:#1f1f1f; --panel2:#2a2a2a;
    --tx:#f2f2f2; --tx2:#b6b6b6; --tx3:#8b8b8b;
    --line:#2c2c2c; --line2:#3a3a3a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Planner Sans",var(--sans);font-size:var(--f-body);line-height:1.5;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
/* ── ground ────────────────────────────────────────────
   The bright theme is mostly paper, and flat paper reads as unfinished. A dot
   grid gives it a weave and two soft washes in the festivals' own colours give
   it a light source. Both are fixed, sit behind everything, and are faint
   enough to leave text contrast untouched. */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{
  background-image:radial-gradient(circle at 1px 1px,
    color-mix(in srgb,var(--tx) 10%,transparent) 1px,transparent 0);
  background-size:26px 26px}
body::after{
  background:
    radial-gradient(56vw 38vw at 6% -10%,rgba(182,252,70,.26),transparent 66%),
    radial-gradient(48vw 32vw at 97% 0%,rgba(255,242,3,.22),transparent 64%),
    radial-gradient(40vw 30vw at 50% 108%,rgba(182,252,70,.14),transparent 70%)}
:root[data-theme=dark] body::before{opacity:.45}
:root[data-theme=dark] body::after{opacity:.3}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) body::before{opacity:.45}
  :root:not([data-theme=light]) body::after{opacity:.3}
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
:focus-visible{outline:2px solid var(--tx);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* masthead, same band as the home page */
header{padding:clamp(20px,2.6vw,28px) 0 0;margin-bottom:clamp(30px,4vw,48px)}
.top{display:flex;align-items:center;gap:14px;
  padding-bottom:clamp(14px,1.8vw,18px);border-bottom:1px solid var(--line)}
.mark{display:inline-flex;align-items:center;gap:clamp(10px,1.2vw,15px);font-family:var(--title);font-weight:600;font-size:var(--f-display);
  letter-spacing:var(--k-display);text-transform:uppercase;line-height:1;
  text-decoration:none;white-space:nowrap}
.logo{width:clamp(30px,3.6vw,44px);height:clamp(30px,3.6vw,44px);flex:none;
  stroke:none;fill:none}
.top .div{width:1px;height:clamp(20px,2.4vw,28px);background:var(--line2);flex:none}
.loc{font-size:var(--f-label);letter-spacing:.15em;text-transform:uppercase;
  color:var(--tx2);white-space:nowrap}
.top .sp{flex:1}
.tbtn{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:10rem;
  display:grid;place-items:center;font-size:16px;transition:.16s var(--ease)}
.tbtn:hover{background:var(--tx);color:var(--bg)}
@media(max-width:560px){.top .div,.loc{display:none}}

.back{display:inline-flex;align-items:center;gap:8px;font-size:var(--f-label);font-weight:650;
  color:var(--tx2);text-decoration:none;padding:10px 0;margin-bottom:6px;
  transition:.15s var(--ease)}
.back:hover{color:var(--tx)}
.back svg{width:15px;height:15px}

/* the document itself: one column at a readable measure */
article{max-width:70ch;padding-bottom:clamp(30px,5vw,56px)}
article h1{margin:0 0 10px;font-family:var(--title);font-weight:600;font-size:var(--f-display);
  line-height:1.02;letter-spacing:var(--k-display);text-transform:uppercase}
.upd{margin:0 0 clamp(26px,3.4vw,38px);font-size:var(--f-caption);letter-spacing:var(--k-caption);
  color:var(--tx3)}
article h2{margin:clamp(30px,3.6vw,44px) 0 12px;font-family:var(--title);font-weight:500;
  font-size:var(--f-h3);line-height:1.1;letter-spacing:.05em;text-transform:uppercase}
article p{margin:0 0 15px;color:var(--tx2);letter-spacing:var(--k-body);text-wrap:pretty}
article strong{color:var(--tx);font-weight:700}
article a{color:var(--tx);text-decoration-thickness:1px;text-underline-offset:3px}
article ul{margin:0 0 15px;padding-left:0;list-style:none}
article li{position:relative;margin:0 0 10px;padding-left:20px;color:var(--tx2);
  letter-spacing:var(--k-body)}
article li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--tx3)}
.lead{font-size:var(--f-title);line-height:1.5;color:var(--tx)}
.callout{margin:0 0 20px;padding:18px 20px;border-radius:14px;background:var(--bg2);
  border:1px solid var(--line2)}
.callout p:last-child{margin:0}

__FOOTER_CSS__
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* Settings persist in a first-party cookie, with local storage as the fallback
   for a page opened straight off disk where cookies are blocked. */
const KEY = 'fp-theme';
const root = document.documentElement;
const jar = {
  read() {
    const m = document.cookie.match(/(?:^|; )fp-theme=([^;]*)/);
    if (m) return decodeURIComponent(m[1]);
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  },
  write(v) {
    try { document.cookie = KEY + '=' + encodeURIComponent(v) +
      ';path=/;Max-Age=' + 60 * 60 * 24 * 400 + ';SameSite=Lax'; } catch (e) {}
    try { localStorage.setItem(KEY, v); } catch (e) {}
  },
};
function applyTheme(t) {
  root.dataset.theme = t;
  document.querySelectorAll('#themeSeg button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.themeSet === t));
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t === 'dark' ? '#101010' : '#e9e9e9';
  jar.write(t);
}
document.querySelectorAll('#themeSeg button').forEach(b =>
  b.onclick = () => applyTheme(b.dataset.themeSet));
applyTheme(jar.read() || 'light');
</script>
<script>
/* Installable, and every page stays readable once it has been opened — which
   is the point at a festival, where the signal goes and the timetable is the
   thing you need. Skipped on file:// where workers cannot register. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js', {scope: '../'}).catch(() => {});
  });
}
</script>
