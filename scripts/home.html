__OG__
<style>
__FONTCSS__
:root{
  --bg:#e9e9e9; --bg2:#fff; --panel:#f3f3f3; --panel2:#e2e2e2;
  --line:rgba(0,0,0,.13); --line2:rgba(0,0,0,.8);
  --tx:#000; --tx2:#3a3a3a; --tx3:#5c5c5c;
  --sans:"Planner Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --title:"Planner Title",var(--sans);
  --ease:cubic-bezier(.16,1,.3,1);
  /* The bar is glass over whatever it covers, the same as on a planner. */
  --glass:rgba(255,255,255,.78); --glass-line:rgba(0,0,0,.16);
  --glass-pill:rgba(0,0,0,.09); --glass-tx:rgba(0,0,0,.55); --glass-on:#000;
  --shade:rgba(0,0,0,.16);
  --navn:4;      /* rail rows: Home, Festivals, My plan, Settings */
  --navcols:4;   /* the phone bar holds the same four, Highlights included */
  --pillbase:0;  /* Highlights is the first cell, not an extra beside it */
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0a0b0d; --bg2:#141518; --panel:#17181c; --panel2:#1f2126;
  --line:#25272d; --line2:#3a3d45;
  --tx:#f2f4f8; --tx2:#a3aab8; --tx3:#848b99;
  --glass:rgba(22,22,25,.7); --glass-line:rgba(255,255,255,.06);
  --glass-pill:rgba(255,255,255,.1); --glass-tx:rgba(255,255,255,.55); --glass-on:#fff;
  --shade:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit}
/* ── ground ────────────────────────────────────────────
   The bright theme is mostly paper, and flat paper reads as unfinished. A dot
   grid gives it a weave and two soft washes in the festivals' own colours give
   it a light source. Both are fixed, sit behind everything, and are faint
   enough to leave text contrast untouched. */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{
  background-image:radial-gradient(circle at 1px 1px,
    color-mix(in srgb,var(--tx) 10%,transparent) 1px,transparent 0);
  background-size:26px 26px}
body::after{
  background:
    radial-gradient(56vw 38vw at 6% -10%,rgba(182,252,70,.26),transparent 66%),
    radial-gradient(48vw 32vw at 97% 0%,rgba(255,242,3,.22),transparent 64%),
    radial-gradient(40vw 30vw at 50% 108%,rgba(182,252,70,.14),transparent 70%)}
:root[data-theme=dark] body::before{opacity:.45}
:root[data-theme=dark] body::after{opacity:.3}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) body::before{opacity:.45}
  :root:not([data-theme=light]) body::after{opacity:.3}
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
:focus-visible{outline:2px solid var(--tx);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── masthead ─────────────────────────────────────────
   A defined band rather than three items floating in white space: wordmark
   left, descriptor after a short rule, controls right, hairline underneath.
   The deck sits below the rule at a readable measure. */
header{padding:clamp(20px,2.6vw,28px) 0 0;margin-bottom:clamp(30px,4vw,48px)}
.top{display:flex;align-items:center;gap:14px;
  padding-bottom:clamp(14px,1.8vw,18px);border-bottom:1px solid var(--line)}
.mark{display:inline-flex;align-items:center;gap:clamp(11px,1.3vw,16px);
  text-decoration:none;white-space:nowrap}
.wm{display:flex;flex-direction:column;gap:3px;min-width:0}
.wm b{font-family:var(--title);font-weight:600;font-size:var(--f-display);
  letter-spacing:var(--k-display);text-transform:uppercase;line-height:1}
.wm i{font-style:normal;font-size:clamp(10px,.95vw,12px);font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;color:var(--tx2);line-height:1}
.logo{width:clamp(30px,3.6vw,44px);height:clamp(30px,3.6vw,44px);flex:none;
  stroke:none;fill:none}
.top .div{width:1px;height:clamp(20px,2.4vw,28px);background:var(--line2);flex:none}
.locwrap{position:relative;flex:none}
.loc{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;
  border-radius:10rem;font-size:var(--f-label);letter-spacing:.15em;text-transform:uppercase;
  color:var(--tx2);white-space:nowrap;transition:.15s var(--ease)}
.loc:hover{background:var(--panel2);color:var(--tx)}
.loc[aria-expanded=true]{background:var(--tx);color:var(--bg)}
.loc svg{width:14px;height:14px}
.loc .cv{width:12px;height:12px;opacity:.7;transition:transform .18s var(--ease)}
.loc[aria-expanded=true] .cv{transform:rotate(180deg)}
.locsheet{left:0;right:auto;max-width:min(92vw,320px)}
.locsheet .opts{flex-direction:column;align-items:stretch}
.locsheet .opt{width:100%}
.opt.find{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;
  border-style:dashed;justify-content:center}
.opt.find svg{width:15px;height:15px}
.locnote{margin:12px 0 0;font-size:12px;line-height:17px;color:var(--tx3)}
.top .sp{flex:1}
.tbtn{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:10rem;
  display:grid;place-items:center;font-size:16px;transition:.16s var(--ease)}
.tbtn:hover{background:var(--tx);color:var(--bg)}
/* The place control stays on small screens — it is a control now, not a label —
   but the wordmark, the control and the theme toggle will not share one row at
   375px, so the control takes its own line. */
@media(max-width:620px){
  .top{flex-wrap:wrap;row-gap:10px}
  .top .div{display:none}
  .mark{flex:1 1 auto}
  .wm b{font-size:clamp(26px,7.6vw,34px)}
  .wm i{letter-spacing:.18em}
  .top .sp{order:2}
  .tbtn{order:3}
  .locwrap{order:4;flex-basis:100%}
  .loc{margin-left:-12px}}

/* ── type scale ────────────────────────────────────────
   Sizes and leading follow the Material 3 type scale, with the roles named
   after Apple's HIG ramp where the two agree. Two rules drive the numbers:
   body copy never drops below 16px, and tracking goes positive as size goes
   down (small text needs air) and negative as it goes up (large text needs
   none). Leading is 1.5 for body, 1.1–1.2 for display. */
:root{
  --f-display:clamp(34px,5.2vw,52px);   --l-display:1;     --k-display:.008em;
  --f-h2:clamp(25px,3vw,34px);          --l-h2:1.05;       --k-h2:.03em;
  --f-h3:clamp(22px,2.4vw,28px);        --l-h3:1.08;       --k-h3:.02em;
  --f-title:17px;                       --l-title:1.32;    /* HIG Headline    */
  --f-body:16px;                        --l-body:1.5;      --k-body:.005em;
  --f-sub:15px;                         --l-sub:1.47;      --k-sub:.008em;
  --f-label:14px;                       --l-label:1.43;    --k-label:.01em;
  --f-caption:13px;                     --l-caption:1.38;  --k-caption:.02em;
  --f-over:12px;                        --l-over:1.33;     --k-over:.06em;
}

/* ── hero ──────────────────────────────────────────────
   One festival at a time. The picture carries the left of the composition and
   the facts panel breaks out over its top-right corner, so the two read as one
   object rather than an image with a caption parked underneath. Below 900px
   the overlap would crush the text, so the panel drops beneath the picture. */
.hero{margin:0 0 clamp(30px,4vw,46px)}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:clamp(14px,1.8vw,20px);
  flex-wrap:wrap}
.shead h2{margin:0;font-family:var(--title);font-weight:500;font-size:var(--f-h2);
  line-height:var(--l-h2);letter-spacing:var(--k-h2);text-transform:uppercase}
.shead p{margin:0;color:var(--tx2);font-size:var(--f-label);line-height:var(--l-label);
  letter-spacing:var(--k-label)}

.stage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  column-gap:clamp(12px,1.6vw,22px);row-gap:clamp(14px,1.8vw,20px);align-items:start}
.fig{grid-area:1/1/3/9;position:relative;display:block;border-radius:18px;overflow:hidden;
  aspect-ratio:3/2;background:var(--panel);text-decoration:none;touch-action:pan-y}
.fig img.pic{width:100%;height:100%;object-fit:cover;display:block}
.fig .veil{position:absolute;inset:0;background:linear-gradient(180deg,
  transparent 40%,rgba(0,0,0,.26) 66%,rgba(0,0,0,.7) 84%,rgba(0,0,0,.88) 100%)}
.fig .lg{display:block;position:absolute;left:24px;bottom:22px;z-index:2;width:max-content;
  max-width:min(72%,340px)}
.fig .lg img{height:clamp(38px,4.4vw,56px);width:auto;max-width:100%;display:block;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
.fig .badge{position:absolute;left:18px;top:18px;z-index:2;display:inline-flex;align-items:center;
  font-family:var(--title);font-weight:500;font-size:var(--f-over);letter-spacing:var(--k-over);
  text-transform:uppercase;background:var(--fa,#fff);color:var(--fi,#000);
  padding:6px 14px 7px;border-radius:10rem}

.side{grid-area:1/9/3/13;z-index:3;align-self:center;
  display:flex;flex-direction:column}
.panel{--tuck:clamp(26px,5vw,64px);
  margin-left:calc(-1 * var(--tuck));
  background:color-mix(in srgb,var(--fa,#fff) 8%,var(--bg2));
  border-radius:16px;padding:clamp(22px,2.6vw,34px) var(--tuck);
  box-shadow:0 24px 54px -30px rgba(0,0,0,.5)}
.fline{margin:0 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-family:var(--title);font-weight:500;font-size:var(--f-label);line-height:1.2;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.fline .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55}
/* The date is the thing people scan for, so it is set as a filled chip in the
   festival's own colour rather than as one more item in a grey run-on line. */
.fdate{background:var(--fa,var(--tx));color:var(--fi,var(--bg2));
  padding:7px 13px 8px;border-radius:9px;margin-right:3px;
  font-family:var(--title);font-weight:600;font-size:clamp(14px,1.45vw,18px);
  letter-spacing:.03em;text-transform:uppercase;line-height:1;white-space:nowrap}
.panel h3{margin:0;font-family:var(--title);font-weight:600;font-size:clamp(27px,3.2vw,40px);
  line-height:1.02;letter-spacing:.014em;text-transform:uppercase}
.panel .fwhere{margin:12px 0 0;font-size:var(--f-body);line-height:var(--l-body);color:var(--tx2)}
.panel .fstars{margin:9px 0 0;font-size:var(--f-sub);line-height:var(--l-sub);
  letter-spacing:var(--k-sub);color:var(--tx2)}
.panel .fstars b{color:var(--tx);font-weight:700}

.facts{display:flex;flex-direction:column;gap:10px;align-items:stretch;
  margin:clamp(20px,2.4vw,26px) 0 0;
  padding-top:clamp(18px,2.2vw,24px);
  border-top:1px solid color-mix(in srgb,var(--tx) 12%,transparent)}
.facts .btn{flex:none;width:100%}
.nav{grid-area:3/1/4/13;margin-top:clamp(14px,1.8vw,20px);justify-self:center;display:flex;align-items:center;gap:4px;
  border:1px solid var(--line2);border-radius:10rem;padding:4px;background:var(--bg2)}
.nav button{width:44px;height:44px;border-radius:10rem;display:grid;place-items:center;
  font-size:17px;color:var(--tx2);transition:.15s var(--ease)}
.nav button:hover:not(:disabled){background:var(--tx);color:var(--bg)}
.nav button:disabled{opacity:.3;cursor:default}
.nav .count{font-size:var(--f-caption);letter-spacing:.06em;color:var(--tx2);
  padding:0 10px;font-variant-numeric:tabular-nums}

/* the swap: everything that carries festival identity leaves in the direction
   of travel and the incoming one arrives from the far side */
.fig img.pic,.side,.fig .lg,.fig .badge{
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.stage.out .fig img.pic,.stage.out .side,.stage.out .fig .lg,.stage.out .fig .badge{opacity:0}
.stage.out.back .fig img.pic{transform:scale(1.03) translateX(3%)}
.stage.out.fwd  .fig img.pic{transform:scale(1.03) translateX(-3%)}
.stage.out.back .side{transform:translateX(16px)}
.stage.out.fwd  .side{transform:translateX(-16px)}

@media(max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);row-gap:0}
  .fig{grid-area:auto;aspect-ratio:16/10;border-radius:16px 16px 0 0}
  .side{grid-area:auto;align-self:auto}
  .panel{border-radius:0 0 16px 16px;box-shadow:none;
    border:1px solid var(--line2);border-top:none}
  .panel{--tuck:clamp(20px,4vw,28px);margin-left:0}
  .facts .btn{width:100%}
  .nav{grid-area:auto;margin-top:16px}
}
@media(max-width:430px){
  .facts{flex-direction:column;align-items:stretch}
  .facts .btn{flex:none}
}
__SETTINGS_CSS__
/* ── the phone masthead ────────────────────────────────
   Desktop is untouched. On a phone the masthead is the bar: it stays at the
   top for the whole page, and its right-hand slot holds the place control
   until you reach the festival cards, where it becomes the search. One bar,
   one position, so nothing jumps as you scroll. */
@media(max-width:620px){
  /* The highlight card is a summary, not the whole record: date, name, venue,
     and the card itself opens the planner. Everything it used to spell out is
     one tap away inside. */
  .fig{aspect-ratio:16/11}
  .panel{padding:16px 18px 18px;cursor:pointer}
  .panel h3{font-size:clamp(22px,6.4vw,28px)}
  .panel .fmore,.panel .fstars,.side .facts{display:none}
  .panel .fwhere{margin-top:9px}
  .fline{margin-bottom:9px}

  header{position:sticky;top:0;z-index:70;margin-bottom:0;
    padding-top:clamp(10px,2vw,14px)}
  header::before{content:"";position:absolute;inset:0 -50vw;z-index:0;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-bottom:1px solid transparent;opacity:0;pointer-events:none;
    transition:opacity .26s var(--ease),border-color .26s var(--ease)}
  body.scrolled header::before{opacity:1;border-bottom-color:var(--line)}
  header > *{position:relative;z-index:1}
  .top{padding-bottom:clamp(10px,2vw,14px);border-bottom:none}
  .top .div{display:none}

  /* The two controls occupy the same square and cross-fade between them. */
  .hslot{position:relative;flex:none;display:grid;place-items:center end;
    min-width:44px;min-height:44px}
  .hslot > *{grid-area:1/1}
  .locwrap{transition:opacity .28s var(--ease),transform .34s var(--ease)}
  body.at-cards .locwrap{opacity:0;transform:scale(.86);pointer-events:none}
  .hslot .sbox{width:44px;opacity:0;transform:scale(.86);pointer-events:none;
    transition:width .38s cubic-bezier(.22,1,.36,1),opacity .28s var(--ease),
               transform .34s var(--ease)}
  body.at-cards .hslot .sbox{opacity:1;transform:none;pointer-events:auto}
  body.at-cards .hslot .sbox.open{width:min(72vw,320px)}

  /* With the field in the masthead the toolbar is just the two filters. */
  .tools{position:static;padding:0;margin:0 0 clamp(14px,2vw,20px)}
  .tools::before{display:none}
  .tools .toolmark{display:none}
  .tools{grid-template-columns:1fr 1fr;grid-template-areas:"filters filters"}
}

__NAV_CSS__
/* The planner keeps its Home button as a separate pill above the rail; here
   the rail is short enough to hold it as an ordinary item at every width. */
@media(min-width:821px){
  .navhome-m{display:grid;place-content:center;gap:5px;justify-items:center;
    text-decoration:none;position:relative;z-index:1;color:var(--glass-tx);
    border-radius:21px;padding:14px 0;font-size:10.5px;font-weight:600}
  .navhome-m svg{width:22px;height:22px;stroke:none;fill:none}
  .navhome-m .lbl{display:block}
}
@media(prefers-reduced-motion:reduce){
  .fig img.pic,.side,.fig .lg,.fig .badge{transition:opacity .01ms}
  .stage.out .fig img.pic{transform:none}
}

/* ── search and filters ────────────────────────────────
   Straight from the reference: one wide search pill, then two dropdown
   triggers. The category sheet holds chips and commits on Apply, so a
   multi-select does not re-render the list on every tap. */
/* The bar sits below the highlight in normal flow and pins to the top once the
   highlight has scrolled past it, growing its backdrop and revealing the mark
   as it does. */
.tools{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;
  flex-wrap:wrap;margin:0 0 clamp(18px,2.4vw,26px);padding:10px 0;
  transition:padding .26s var(--ease)}
/* The bar lives inside a max-width column, so its backdrop is painted by a
   pseudo-element stretched past the gutters rather than by the bar itself. */
.tools::before{content:"";position:absolute;inset:0 -50vw;z-index:0;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;
  opacity:0;transition:opacity .24s var(--ease),border-color .24s var(--ease);
  pointer-events:none}
.tools > *{position:relative;z-index:1}
.tools.stuck{padding:13px 0}
.tools.stuck::before{opacity:1;border-bottom-color:var(--line)}

/* the mark only appears once the masthead has scrolled away */
.toolmark{display:flex;align-items:center;gap:9px;flex:none;text-decoration:none;
  max-width:0;overflow:hidden;opacity:0;
  transition:max-width .3s var(--ease),opacity .2s var(--ease),margin .3s var(--ease)}
.tools.stuck .toolmark{max-width:220px;opacity:1;margin-right:2px}
.toolmark svg{width:30px;height:30px;flex:none;stroke:none;fill:none}
.toolmark .wm{display:flex;flex-direction:column;gap:2px;min-width:0}
.toolmark .wm i{font-style:normal;font-size:10px;font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx2);line-height:1;white-space:nowrap}
.toolmark b{font-family:var(--title);font-weight:600;font-size:19px;letter-spacing:.05em;
  text-transform:uppercase;line-height:1;color:var(--tx)}
.sbox{position:relative;flex:1 1 280px;min-width:0}
.sbox svg.i{position:absolute;left:17px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--tx3);pointer-events:none}
.sbox input{width:100%;height:50px;border-radius:10rem;border:1px solid var(--line2);
  background:var(--bg2);padding:0 44px 0 44px;font:inherit;font-size:var(--f-body);
  color:var(--tx);transition:.16s var(--ease)}
.sbox input::placeholder{color:var(--tx3)}
.sbox input:focus{outline:none;border-color:var(--tx)}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border-radius:10rem;display:grid;place-items:center;color:var(--tx3);font-size:15px}
.sbox .clr:hover{background:var(--panel2);color:var(--tx)}
.sbox .clr[hidden]{display:none}
.drop{position:relative;flex:none}
.trig{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 20px;
  border-radius:10rem;border:1px solid var(--line2);background:var(--bg2);
  font-size:var(--f-body);font-weight:650;transition:.16s var(--ease);white-space:nowrap}
.trig svg.i{width:17px;height:17px;color:var(--tx2)}
.trig:hover{border-color:var(--tx)}
.trig[aria-expanded=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.trig[aria-expanded=true] svg.i{color:var(--bg)}
.trig .n{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;
  border-radius:10rem;background:var(--tx);color:var(--bg);font-size:12px;font-weight:700}
.trig[aria-expanded=true] .n{background:var(--bg);color:var(--tx)}
.sheet{position:absolute;top:calc(100% + 8px);right:0;z-index:40;width:max-content;
  max-width:min(92vw,440px);background:var(--bg2);border:1px solid var(--line2);
  border-radius:18px;padding:18px;box-shadow:0 26px 60px -28px rgba(0,0,0,.5);
  transform-origin:top right}
.sheet[hidden]{display:none}
@starting-style{.sheet{opacity:0;transform:scale(.97) translateY(-4px)}}
.sheet{transition:opacity .18s var(--ease),transform .18s var(--ease)}
.sheet h4{margin:0 0 14px;font-size:var(--f-caption);letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx2);font-weight:700}
.sheet .opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:var(--f-sub);font-weight:600;padding:9px 15px;border-radius:10rem;
  border:1px solid var(--line2);color:var(--tx2);transition:.14s var(--ease);
  min-height:40px;text-align:left}
.opt:hover{border-color:var(--tx);color:var(--tx)}
.opt[aria-pressed=true],.opt[aria-checked=true]{background:var(--tx);color:var(--bg);
  border-color:var(--tx)}
.sheet .foot{display:flex;align-items:center;justify-content:flex-end;gap:14px;
  margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
.sheet .foot .lnk{font-size:var(--f-sub);color:var(--tx2);font-weight:600;padding:8px 4px}
.sheet .foot .lnk:hover{color:var(--tx)}
.sheet .foot .go{background:var(--tx);color:var(--bg);border-radius:10rem;padding:11px 24px;
  font-size:var(--f-sub);font-weight:700;min-height:44px}
.dropset{display:contents}
/* On a phone the search box and two triggers will not share one row, and left
   to wrap they produced three ragged ones. Two rows instead: the mark and the
   search, then the filters side by side.

   The sheets anchor to the bar rather than to their trigger here, because a
   trigger-anchored sheet hangs off the viewport at this width. .tools keeps
   position:sticky — an earlier version set position:relative for exactly this
   anchoring, which silently cancelled the sticky and let the bar scroll away. */
@media(max-width:620px){
  /* Same shape as a planner's bar: the lockup holds the left, the field is a
     circle on the right until it is asked for, and the filters take the row
     underneath. */
  .tools{display:grid;align-items:center;gap:8px 10px;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"mark search" "filters filters"}
  .toolmark{grid-area:mark;max-width:none;opacity:1}
  .tools.stuck .toolmark{max-width:none}
  .sbox{grid-area:search;flex:none;width:44px;justify-self:end;
    transition:width .38s cubic-bezier(.22,1,.36,1)}
  .sbox.open{width:min(100%,calc(100vw - 96px))}
  .sbox input{height:44px;padding:0 16px 0 38px;font-size:15px}
  .sbox:not(.open) input{padding:0;color:transparent;cursor:pointer}
  .sbox:not(.open) input::placeholder{color:transparent}
  .sbox svg.i{left:50%;transform:translate(-50%,-50%);
    transition:left .3s var(--ease),transform .3s var(--ease)}
  .sbox.open svg.i{left:14px;transform:translate(0,-50%)}
  .sbox .clr{display:none}
  .dropset{grid-area:filters;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .drop{position:static}
  .trig{width:100%;justify-content:center}
  .sheet{left:0;right:0;width:auto;max-width:none}
}
.active{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin:0 0 clamp(16px,2vw,22px)}
.active:empty{display:none}
.active .tag{display:inline-flex;align-items:center;gap:7px;font-size:var(--f-caption);
  font-weight:650;padding:7px 8px 7px 14px;border-radius:10rem;background:var(--panel2);
  color:var(--tx)}
.active .tag button{width:20px;height:20px;border-radius:10rem;display:grid;place-items:center;
  font-size:12px;color:var(--tx2)}
.active .tag button:hover{background:var(--tx);color:var(--bg)}

/* ── month-grouped cards ──────────────────────────────
   Card anatomy after myhelsinki.fi: flat white card, generous radius, image
   flush to the edges, and a tag notched into the image corner. No borders, no
   shadows at rest — contrast does the work. */
.months{margin:clamp(24px,3vw,38px) 0 0}
.mgroup{margin-bottom:clamp(28px,4vw,46px)}
.mgroup[hidden]{display:none}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mhead h3{margin:0;font-family:var(--title);font-weight:500;font-size:var(--f-h2);letter-spacing:var(--k-h2);
  text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap}
.mhead .ct{font-size:var(--f-label);line-height:var(--l-label);letter-spacing:var(--k-label);
  color:var(--tx2);white-space:nowrap}
.mhead hr{flex:1;border:none;border-top:2px solid var(--tx);margin:0;opacity:.9}
.card .figs b,.card .stars b{color:var(--tx)}
.grid{display:grid;gap:clamp(16px,2vw,24px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.card{background:color-mix(in srgb,var(--fa,#fff) 7%,var(--bg2));border-radius:24px;overflow:hidden;display:flex;
  flex-direction:column;transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.card[hidden]{display:none}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -22px rgba(0,0,0,.5)}
.card.past .shot img.pic{filter:grayscale(.8) contrast(.95)}

.card .shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--fa,var(--panel))}
.card .shot img.pic{width:100%;height:100%;object-fit:cover;display:block}
.card .lg{position:absolute;left:18px;top:16px;width:max-content;max-width:66%;z-index:2}
.card .lg img{height:clamp(34px,4vw,44px);width:auto;max-width:100%;display:block;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
/* the notched tag: a black block whose top-left corner curves back into the image */
.notch{position:absolute;right:0;bottom:0;z-index:2;background:var(--fa,var(--tx));color:var(--fi,var(--bg2));
  font-family:var(--title);font-size:var(--f-caption);letter-spacing:var(--k-over);text-transform:uppercase;
  padding:11px 18px 12px;border-top-left-radius:22px}
.notch::before,.notch::after{content:"";position:absolute;width:22px;height:22px;
  background:radial-gradient(circle at 0 0,transparent 22px,var(--fa,var(--tx)) 22px)}
.notch::before{right:100%;bottom:0}
.notch::after{right:0;bottom:100%}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.ttl{display:flex;align-items:flex-start;gap:12px}
.ttl h4{flex:1;min-width:0}
.offi{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:var(--f-caption);
  letter-spacing:var(--k-caption);font-weight:700;
  color:var(--tx2);text-decoration:none;border:1.5px solid var(--line2);border-radius:10rem;
  padding:5px 11px;margin-top:1px;white-space:nowrap;transition:.16s var(--ease)}
/* the pill stays visually light beside the title, but its hit area is
   expanded to the 44pt minimum both HIG and Material ask for */
.offi::after{content:'';position:absolute;inset:-5px -6px}
.offi:hover{color:var(--tx);border-color:var(--tx);
  background:color-mix(in srgb,var(--fa,var(--tx)) 26%,transparent)}
.offi svg{width:12px;height:12px}
.body h4{margin:0;font-family:var(--title);font-size:var(--f-h3);text-transform:uppercase;
  letter-spacing:var(--k-h3);line-height:var(--l-h3);font-weight:600}
.when{font-size:var(--f-title);line-height:var(--l-title);color:var(--tx);font-weight:650;
  font-variant-numeric:tabular-nums}
.where{font-size:var(--f-sub);line-height:var(--l-sub);letter-spacing:var(--k-sub);
  color:var(--tx2);margin-top:-6px}
.stars{font-size:var(--f-sub);line-height:var(--l-sub);letter-spacing:var(--k-sub);color:var(--tx2)}
.stars b{color:var(--tx);font-weight:700}
.cats{font-size:var(--f-label);line-height:var(--l-label);letter-spacing:var(--k-label);
  font-weight:700;color:var(--tx)}
.figs{display:flex;gap:18px;font-size:var(--f-label);line-height:var(--l-label);
  letter-spacing:var(--k-label);color:var(--tx2)}
.figs b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  white-space:nowrap;font-size:var(--f-body);font-weight:650;
  letter-spacing:var(--k-label);padding:12px 20px;border-radius:10rem;border:1.5px solid var(--tx);text-decoration:none;
  transition:.16s var(--ease);min-height:44px;color:var(--tx)}
.btn:hover{background:color-mix(in srgb,var(--fa,var(--tx)) 26%,transparent)}
.btn.primary{background:var(--fa,var(--tx));color:var(--fi,var(--bg2));
  border-color:var(--fa,var(--tx));flex:1 1 auto}
.btn.primary:hover{filter:brightness(1.06) saturate(1.15)}
.acts .btn:not(.primary){flex:0 1 auto}
.btn.free{border-style:dashed;color:var(--tx3);border-color:var(--line2)}
/* below this width the two actions stop fitting side by side; a clean stack
   beats one full-width button with an orphan beneath it */
@media(max-width:430px){.acts{flex-direction:column;align-items:stretch}
  .acts .btn{width:100%}}
.empty{padding:40px 0;text-align:center;color:var(--tx2);font-size:var(--f-body);
  line-height:var(--l-body)}

<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;


/* Days until a festival opens — drives the "on now / in N days" line. */
const today = new Date(); today.setHours(0,0,0,0);
const daysTo = f => Math.round((new Date(f.start + 'T00:00:00') - today) / 86400000);
const status = f => {
  const a = daysTo(f), b = Math.round((new Date(f.end + 'T00:00:00') - today) / 86400000);
  if (a <= 0 && b >= 0) return {label: 'Happening now', live: true};
  if (a === 1) return {label: 'Tomorrow'};
  if (a > 1) return {label: `In ${a} days`};
  return {label: 'Finished', past: true};
};

const fvars = f => `--fa:${f.accent};--fi:${f.ink}`;

/* ── the hero ──────────────────────────────────────────
   One festival on screen at a time. Every image is already a data URI in the
   document, so swapping src is instant and the crossfade never shows a gap. */
const byDate = DATA.festivals.slice().sort((a, b) => a.start.localeCompare(b.start));
const reel = [...byDate.filter(f => !status(f).past), ...byDate.filter(f => status(f).past)];
let cur = 0;

if (reel.length) {
  $('#hero').hidden = false;
  const stage = $('#stage');

  const shell = f => {
    const st = status(f);
    return `
    <a class="fig" href="${esc(f.planner)}" aria-label="Open the ${esc(f.name)} planner">
      <img class="pic" src="${f.promoSrc}" alt="">
      <span class="veil"></span>
      <span class="badge">${esc(st.label)}</span>
      <span class="lg"><img src="${f.logoSrc}" alt="${esc(f.name)}"></span>
    </a>
    <div class="side">
    <div class="panel" data-open="${esc(f.planner)}">
      <p class="fline">
        <span class="fdate">${esc(f.dates)}</span>
        <span>${esc(f.free ? 'Free' : 'Ticketed')}</span><span class="dot"></span>
        <span>${esc(st.label)}</span>
      </p>
      <h3>${esc(f.name)} ${esc(f.year)}</h3>
      <p class="fwhere"><span class="fcity">${esc(f.city)}</span><span class="fmore"> · ${esc(f.type)} · ${f.stats.acts} acts on ${f.stats.stages} stages</span></p>
      <p class="fstars"><b>${st.past ? 'Played' : 'Headlining'}:</b> ${esc(f.stars.slice(0, 4).join(' · '))}</p>
      <div class="facts">
      <a class="btn primary" href="${esc(f.planner)}">${st.past ? 'Browse timetable' : 'Open planner'} ${ico('arrow')}</a>
      ${f.free
        ? `<a class="btn" href="${esc(f.official)}" target="_blank" rel="noopener">Official ${ico('ext')}</a>`
        : `<a class="btn" href="${esc(f.tickets)}" target="_blank" rel="noopener">Tickets ${ico('ticket')}</a>`}
      </div>
    </div>
    </div>
    ${reel.length > 1 ? `<div class="nav">
      <button id="prev" aria-label="Previous festival" ${cur ? '' : 'disabled'}>
        <svg class="i"><use href="#i-left"/></svg></button>
      <span class="count">${cur + 1} / ${reel.length}</span>
      <button id="next" aria-label="Next festival" ${cur < reel.length - 1 ? '' : 'disabled'}>
        <svg class="i"><use href="#i-right"/></svg></button>
    </div>` : ''}`;
  };

  function paint() {
    const f = reel[cur], st = status(f);
    $('#heroHead').textContent = st.live ? 'On now' : st.past ? 'Recently' : 'Next up';
    $('#heroNote').textContent = `${DATA.festivals.length} planner${DATA.festivals.length > 1 ? 's' : ''}`;
    stage.setAttribute('style', fvars(f));
    stage.innerHTML = shell(f);
    const pv = $('#prev'), nx = $('#next');
    if (pv) pv.onclick = e => { e.preventDefault(); go(cur - 1); };
    if (nx) nx.onclick = e => { e.preventDefault(); go(cur + 1); };
  }

  const motionOK = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;

  function go(i) {
    const next = Math.max(0, Math.min(reel.length - 1, i));
    if (next === cur || busy) return;
    const dir = next > cur ? 'fwd' : 'back';
    if (!motionOK) { cur = next; paint(); return; }
    busy = true;
    stage.classList.add('out', dir);
    setTimeout(() => {
      cur = next;
      paint();
      /* let the fresh nodes land in their offset state, then release */
      stage.classList.remove(dir);
      stage.classList.add(dir === 'fwd' ? 'back' : 'fwd');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        stage.classList.remove('out', 'fwd', 'back');
        busy = false;
      }));
    }, 300);
  }

  /* a swipe across the picture moves between festivals; the threshold keeps a
     vertical scroll that starts on the image from stealing the gesture */
  let sx = 0, sy = 0, tracking = false;
  stage.addEventListener('touchstart', e => {
    if (!e.target.closest('.fig')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive: true});
  stage.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.6) go(cur + (dx < 0 ? 1 : -1));
  }, {passive: true});

  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,[role=dialog]')) return;
    if (e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'ArrowRight') go(cur + 1);
  });

  paint();
}

/* ── month groups ─────────────────────────────────────── */
const MONTH = ['January','February','March','April','May','June',
               'July','August','September','October','November','December'];
const groups = {};
DATA.festivals.slice().sort((a, b) => a.start.localeCompare(b.start))
  .forEach(f => (groups[f.month] = groups[f.month] || []).push(f));

$('#months').innerHTML = Object.keys(groups).sort().map(m => {
  const [y, mo] = m.split('-');
  const list = groups[m].slice().sort((a, b) =>
        (status(a).past - status(b).past) || a.start.localeCompare(b.start));
  return `<div class="mgroup">
    <div class="mhead">
      <h3>${MONTH[+mo - 1]} ${y}</h3>
      <span class="ct" data-total="${list.length}"></span>
      <hr>
    </div>
    <div class="grid">${list.map(card).join('')}</div>
  </div>`;
}).join('');

function card(f) {
  const st = status(f);
  return `<article class="card${st.past ? ' past' : ''}" style="${fvars(f)}"
             data-id="${esc(f.id)}" data-cost="${f.free ? 'free' : 'paid'}">
    <div class="shot">
      <img class="pic" src="${f.promoSrc}" alt="" loading="lazy">
      <span class="lg"><img src="${f.logoSrc}" alt="${esc(f.name)}"></span>
      <span class="notch">${esc(st.past ? 'Finished' : st.label)}</span>
    </div>
    <div class="body">
      <div class="ttl">
        <h4>${esc(f.name)} ${esc(f.year)}</h4>
        <a class="offi" href="${esc(f.official)}" target="_blank" rel="noopener"
           title="Official site for ${esc(f.name)}">Official ${ico('ext')}</a>
      </div>
      <div class="when">${esc(f.dates)}</div>
      <div class="where">${esc(f.city)} · ${esc(f.type)}</div>
      <div class="figs">
        <span><b>${f.stats.acts}</b> acts</span>
        <span><b>${f.stats.stages}</b> stages</span>
        <span><b>${f.stats.days}</b> day${f.stats.days > 1 ? 's' : ''}</span>
      </div>
      <p class="stars"><b>${st.past ? 'Played' : 'Headlining'}:</b> ${esc(f.stars.slice(0, 4).join(' · '))}</p>
      <div class="cats">${esc(f.tags.join(', '))}</div>
      <div class="acts">
        <a class="btn primary" href="${esc(f.planner)}">${st.past ? 'Browse timetable' : 'Open planner'} ${ico('arrow')}</a>
        ${f.free
          ? `<span class="btn free">Free entry</span>`
          : `<a class="btn" href="${esc(f.tickets)}" target="_blank" rel="noopener">Tickets ${ico('ticket')}</a>`}
      </div>
    </div>
  </article>`;
}

/* ── the toolbar sticks ────────────────────────────────
   A pinned sticky element sits at exactly top:0 and an unpinned one sits below
   it, so the bar's own offset is the signal — no sentinel to fall out of step
   with it. Read synchronously on scroll: an earlier version deferred to
   requestAnimationFrame behind a guard flag, and anywhere frames are not being
   produced the guard latched and the bar froze in one state. */
const tools = $('#tools');
/* The bar sits below the highlight while that is on screen and pins once it
   reaches the top — which is exactly when its own offset hits zero. Nothing
   above it collapses, so the measurement cannot feed back into the layout. */
function readStuck() {
  tools.classList.toggle('stuck', tools.getBoundingClientRect().top <= 0);
}
addEventListener('scroll', readStuck, {passive: true});
addEventListener('resize', readStuck, {passive: true});
readStuck();

/* ── place ─────────────────────────────────────────────
   Finland by default, because that is everything the site covers. The browser
   only asks for coordinates when someone presses the button, and the answer is
   used once, here, to pick the nearest place on this list — it is never stored
   and never leaves the page. */
const PLACES = [
  {k: 'fi',  label: 'Finland',  lat: 62.6, lon: 25.7},
  {k: 'hel', label: 'Helsinki', lat: 60.17, lon: 24.94},
];
const PKEY = 'fp-place';
let place = (() => { try { return localStorage.getItem(PKEY) || 'fi'; } catch (e) { return 'fi'; } })();

const kmBetween = (a, b) => {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

function paintPlace() {
  $('#locLabel').textContent = (PLACES.find(p => p.k === place) || PLACES[0]).label;
  $('#locOpts').querySelectorAll('.opt').forEach(o =>
    o.setAttribute('aria-checked', o.dataset.k === place));
}
$('#locOpts').innerHTML = PLACES.map(p =>
  `<button class="opt" role="radio" data-k="${p.k}" aria-checked="false">${p.label}</button>`).join('');
$('#locOpts').querySelectorAll('.opt').forEach(o => o.onclick = () => {
  place = o.dataset.k;
  try { localStorage.setItem(PKEY, place); } catch (e) {}
  paintPlace();
  openSheet(null);
});
$('#locFind').onclick = () => {
  const note = $('#locNote');
  if (!navigator.geolocation) {
    note.textContent = 'This browser cannot report a location.';
    return;
  }
  note.textContent = 'Asking your browser…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const here = {lat: pos.coords.latitude, lon: pos.coords.longitude};
      const near = PLACES.slice().sort((a, b) => kmBetween(here, a) - kmBetween(here, b))[0];
      const away = Math.round(kmBetween(here, PLACES.find(p => p.k === 'hel')));
      place = away < 120 ? 'hel' : 'fi';
      try { localStorage.setItem(PKEY, place); } catch (e) {}
      paintPlace();
      note.textContent = away < 120
        ? `You are about ${away} km from Helsinki — showing what is on there.`
        : `Nearest covered place is Helsinki, about ${away} km away. Only Finnish festivals so far.`;
    },
    err => {
      note.textContent = err.code === err.PERMISSION_DENIED
        ? 'Location denied. Pick a place from the list instead.'
        : 'Could not read a location. Pick a place from the list instead.';
    },
    {timeout: 8000, maximumAge: 600000}
  );
};
paintPlace();

/* ── search, date scope and categories ─────────────────
   Search and date apply as you touch them; categories commit on Apply, so
   picking four chips re-renders the list once rather than four times. */
/* Defaults to everything. This is an archive of a handful of planners, not a
   live feed of hundreds, so hiding a festival that finished yesterday costs
   more than it saves — the countdown badges already carry the timing. */
const WHEN = [
  {k: 'any',   label: 'All festivals', test: () => true},
  {k: 'up',    label: 'Upcoming',      test: f => !status(f).past},
  {k: 'month', label: 'This month',    test: f => f.month === thisMonth},
  {k: 'past',  label: 'Past',          test: f => status(f).past},
];
const thisMonth = new Date().toISOString().slice(0, 7);
const CATS = [...new Set(DATA.festivals.flatMap(f => [f.type, ...f.tags]))].sort();

let when = 'any', cats = new Set(), draft = new Set(), q = '';

$('#whenOpts').innerHTML = WHEN.map(w =>
  `<button class="opt" role="radio" data-k="${w.k}" aria-checked="${w.k === when}">${w.label}</button>`).join('');
$('#catOpts').innerHTML = CATS.map(c =>
  `<button class="opt" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('');

const haystack = f => [f.name, f.city, f.type, ...f.tags, ...f.stars, f.description]
  .join(' ').toLowerCase();

function apply() {
  const w = WHEN.find(x => x.k === when);
  const needle = q.trim().toLowerCase();
  let shown = 0;
  DATA.festivals.forEach(f => {
    const el = document.querySelector(`.card[data-id="${f.id}"]`);
    if (!el) return;
    const ok = w.test(f)
      && (!needle || haystack(f).includes(needle))
      && (!cats.size || [f.type, ...f.tags].some(t => cats.has(t)));
    el.hidden = !ok;
    if (ok) shown++;
  });
  document.querySelectorAll('.mgroup').forEach(g => {
    const n = g.querySelectorAll('.card:not([hidden])').length;
    const ct = g.querySelector('.ct'), total = +ct.dataset.total;
    ct.textContent = n === total
      ? `${total} festival${total > 1 ? 's' : ''}`
      : `${n} of ${total} shown`;
    g.hidden = !n;
  });
  $('#empty').hidden = shown > 0;
  $('#whenLabel').textContent = WHEN.find(x => x.k === when).label;
  $('#catN').hidden = !cats.size;
  $('#catN').textContent = cats.size;
  $('#activeTags').innerHTML = [...cats].map(c =>
    `<span class="tag">${esc(c)}<button data-drop="${esc(c)}" aria-label="Remove ${esc(c)}">
      <svg class="i"><use href="#i-close"/></svg></button></span>`).join('');
  $('#activeTags').querySelectorAll('[data-drop]').forEach(btn => btn.onclick = () => {
    cats.delete(btn.dataset.drop);
    draft = new Set(cats);
    $('#catOpts').querySelectorAll('.opt').forEach(o =>
      o.setAttribute('aria-pressed', draft.has(o.dataset.c)));
    apply();
  });
}

/* one open sheet at a time, and a click outside closes it */
const sheets = [['#whenTrig', '#whenSheet'], ['#catTrig', '#catSheet'],
                ['#locTrig', '#locSheet']];
function openSheet(which) {
  sheets.forEach(([t, sh]) => {
    const on = sh === which;
    $(t).setAttribute('aria-expanded', on);
    $(sh).hidden = !on;
  });
}
sheets.forEach(([t, sh]) => $(t).onclick = e => {
  e.stopPropagation();
  openSheet($(sh).hidden ? sh : null);
  if (sh === '#catSheet' && !$(sh).hidden) {
    draft = new Set(cats);
    $('#catOpts').querySelectorAll('.opt').forEach(o =>
      o.setAttribute('aria-pressed', draft.has(o.dataset.c)));
  }
});
document.querySelectorAll('.sheet').forEach(el => el.onclick = e => e.stopPropagation());
document.addEventListener('click', () => openSheet(null));

$('#whenOpts').querySelectorAll('.opt').forEach(o => o.onclick = () => {
  when = o.dataset.k;
  $('#whenOpts').querySelectorAll('.opt').forEach(x =>
    x.setAttribute('aria-checked', x.dataset.k === when));
  openSheet(null);
  apply();
});
$('#catOpts').querySelectorAll('.opt').forEach(o => o.onclick = () => {
  draft.has(o.dataset.c) ? draft.delete(o.dataset.c) : draft.add(o.dataset.c);
  o.setAttribute('aria-pressed', draft.has(o.dataset.c));
});
$('#catClear').onclick = () => {
  draft.clear();
  $('#catOpts').querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', false));
};
$('#catApply').onclick = () => { cats = new Set(draft); openSheet(null); apply(); };

$('#q').addEventListener('input', e => {
  q = e.target.value;
  $('#qClr').hidden = !q;
  apply();
});
$('#qClr').onclick = () => { $('#q').value = ''; q = ''; $('#qClr').hidden = true; apply(); };

/* On a phone the field folds away when empty, the same as on a planner. */
(() => {
  const box = document.querySelector('.sbox'), input = $('#q');
  const narrow = matchMedia('(max-width:620px)');
  const open = () => { box.classList.add('open'); input.focus(); };
  box.addEventListener('click', () => {
    if (narrow.matches && !box.classList.contains('open')) open();
  });
  input.addEventListener('blur', () => { if (!input.value) box.classList.remove('open'); });
  input.addEventListener('input', () => { if (input.value) box.classList.add('open'); });
  if (input.value) box.classList.add('open');
})();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { openSheet(null); if (document.activeElement === $('#q')) $('#q').blur(); }
});

/* ── bottom bar ────────────────────────────────────────
   The same component as the planners': Home returns to the top, Settings opens
   the card, and My plan is reserved for a page that does not exist yet, so it
   says so rather than doing nothing. */
(() => {
  /* Two of these are places on the page, so the bar shows which one you are
     reading rather than only what you last tapped. */
  const SPOTS = [{id: 'nTop', sel: '.hero'}, {id: 'nFest', sel: '.months'}];
  const pill = $('#navPill');
  const setActive = id => {
    const all = ['nTop', 'nFest', 'nPlan', 'nSet'];
    all.forEach(k => $('#' + k) && $('#' + k).classList.toggle('on', k === id));
    const i = all.indexOf(id);
    if (i >= 0 && pill) pill.style.setProperty('--i', i);
  };
  const goto = (sel, id) => {
    const el = document.querySelector(sel);
    if (!el) return;
    setActive(id);
    scrollTo({top: Math.max(0, el.getBoundingClientRect().top + scrollY - 90), behavior: 'smooth'});
  };
  $('#nTop').onclick = () => { setActive('nTop'); scrollTo({top: 0, behavior: 'smooth'}); };
  $('#nFest').onclick = () => goto('.months', 'nFest');

  /* Whichever section owns the middle of the screen is the one you are on. */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => {
      es.forEach(e => {
        if (!e.isIntersecting) return;
        const spot = SPOTS.find(s => document.querySelector(s.sel) === e.target);
        if (spot) setActive(spot.id);
      });
    }, {rootMargin: '-45% 0px -50% 0px'});
    SPOTS.forEach(s => { const el = document.querySelector(s.sel); if (el) io.observe(el); });
  }
  setActive('nTop');

  /* The masthead's right slot follows the same signal as the bar: over the
     cards it is the search, everywhere else the place control. */
  const atCards = on => document.body.classList.toggle('at-cards', on);
  const spy = new MutationObserver(() => atCards($('#nFest').classList.contains('on')));
  spy.observe($('#nFest'), {attributes: true, attributeFilter: ['class']});
  atCards(false);

  /* The field belongs in the masthead on a phone and in the toolbar on a
     pointer device — the same element, moved, rather than two of them. */
  const phone = matchMedia('(max-width:620px)');
  const slot = $('#hslot'), bar = $('#tools'), field = document.querySelector('.sbox');
  const place = () => {
    const host = phone.matches ? slot : bar;
    if (field.parentElement !== host) {
      phone.matches ? host.appendChild(field) : host.insertBefore(field, host.children[1]);
    }
  };
  phone.addEventListener('change', place);
  place();

  /* On a phone the summary card is the affordance, so tapping anywhere on it
     opens the planner. The buttons it replaces are hidden at that width. */
  $('#stage').addEventListener('click', e => {
    if (!phone.matches) return;
    if (e.target.closest('a,button')) return;
    const panel = e.target.closest('.panel[data-open]');
    if (panel) location.href = panel.dataset.open;
  });

  /* Scrolled at all is enough to earn the frosted panel behind the masthead. */
  const frost = () => document.body.classList.toggle('scrolled', scrollY > 8);
  addEventListener('scroll', frost, {passive: true});
  frost();
  const plan = $('#nPlan');
  if (plan) plan.onclick = () => {
    plan.classList.add('on');
    setTimeout(() => plan.classList.remove('on'), 900);
    alert('Your plan lives inside each festival planner for now — open one and star the sets you want.');
  };
  const dlg = $('#setDlg');
  const open = () => { dlg.showModal(); requestAnimationFrame(() => dlg.classList.add('in')); };
  const close = () => { dlg.classList.remove('in');
    setTimeout(() => { if (dlg.open) dlg.close(); }, 260); };
  /* The floating mark sits above the rail and the rail beside the content
     column, both derived from the rail's measured box — the same sync the
     planners run, since they share the stylesheet. */
  const nav = document.querySelector('.mnav'), wrap = document.querySelector('.wrap');
  const sync = () => {
    const r = nav.getBoundingClientRect(), st = document.documentElement.style;
    st.setProperty('--navh', Math.round(r.height) + 'px');
    st.setProperty('--navw', Math.round(r.width) + 'px');
    if (innerWidth > 820) {
      st.setProperty('--railx',
        Math.max(16, Math.round(wrap.getBoundingClientRect().left - r.width - 20)) + 'px');
    } else st.removeProperty('--railx');
  };
  sync();
  if (window.ResizeObserver) new ResizeObserver(sync).observe(nav);
  addEventListener('resize', sync, {passive: true});

  const set = $('#nSet');
  if (set) set.onclick = open;
  $('#setClose').onclick = close;
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
})();

/* ── theme ─────────────────────────────────────────────── */
/* Settings persist in a first-party cookie, with local storage as the fallback
   for a page opened straight off disk where cookies are blocked. */
const KEY = 'fp-theme';
const root = document.documentElement;
const jar = {
  read() {
    const m = document.cookie.match(/(?:^|; )fp-theme=([^;]*)/);
    if (m) return decodeURIComponent(m[1]);
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  },
  write(v) {
    try { document.cookie = KEY + '=' + encodeURIComponent(v) +
      ';path=/;Max-Age=' + 60 * 60 * 24 * 400 + ';SameSite=Lax' +
      (location.protocol === 'https:' ? ';Secure' : ''); } catch (e) {}
    try { localStorage.setItem(KEY, v); } catch (e) {}
  },
};
function applyTheme(t) {
  root.dataset.theme = t;
  document.querySelectorAll('#themeSeg button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.themeSet === t));
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t === 'dark' ? '#101010' : '#e9e9e9';
  jar.write(t);
}
document.querySelectorAll('#themeSeg button').forEach(b =>
  b.onclick = () => applyTheme(b.dataset.themeSet));
applyTheme(jar.read() || 'light');
apply();
</script>
<script>
/* Installable, and every page stays readable once it has been opened — which
   is the point at a festival, where the signal goes and the timetable is the
   thing you need. Skipped on file:// where workers cannot register. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(() => {});
  });
}
</script>
