<script>
/* ── the theme, before the first paint ──────────────────
   One reader for the whole site. The list page owns the setting and writes it
   four ways — cookie and local storage, under `flanner1.theme` and the legacy
   `fp-theme` — and every page has to arrive at the same answer before its
   stylesheet is applied, or a reader who chose dark gets a white flash on the
   way into a page that is about to be black.

   The planners had no reader at all. Their whole scheme is keyed on
   `[data-theme="dark"]` with no `prefers-color-scheme` fallback, and nothing
   on the page ever set that attribute — so every planner was permanently
   light, whatever the reader had chosen two pages earlier. That is what this
   fixes; the flash on the other pages is what it fixes on the way past.

   It runs in the head, before anything is fetched, and it is deliberately
   small: no dependencies, nothing to wait for, and a failure in any of the
   four reads leaves the default rather than throwing in front of the page.

   The default is light, not the device's preference — which is what the list
   page's Store has always answered for an unset value, and changing it here
   would change what an untouched device sees. */
(function () {
  var read = function (k) {
    try {
      var m = document.cookie.match('(?:^|; )' + k.replace('.', '\\.') + '=([^;]*)');
      if (m) return decodeURIComponent(m[1]);
    } catch (e) {}
    try { return localStorage.getItem(k); } catch (e) {}
    return null;
  };
  var t = read('flanner1.theme') || read('fp-theme');
  /* `system` follows the device, which is the third thing a reader can ask
     for and the only one that can change while the page is open. The default
     is still light rather than the device's preference: that is what the list
     page's Store has always answered for an unset value, and changing it here
     would change what an untouched device sees. */
  var dark = t === 'dark' || (t === 'system' && window.matchMedia
    && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  /* The colour the browser paints its own chrome with. It is a meta further
     down this same head, so it does not exist yet — hence the wait. Left
     alone, a dark page kept a light title bar and a light status bar above it,
     which on a phone is the part of the theme a reader sees first. */
  document.addEventListener('DOMContentLoaded', function () {
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = dark ? '#131313' : '#ffffff';
  });
})();
</script>
