<style>
/* ══════════════════════════════════════════════════════════
   THE APP SHELL
   The site used to be three documents and a navigation between
   them. On a phone it is one document now: the list and both
   planners are screens in it, and the dock — back button and bar
   — lives outside all three and never unmounts.

   That is the whole reason the reference feels the way it does.
   A document navigation tears the bar down and builds another
   one; there is no animation that hides it, because there is a
   frame where neither bar exists. Keeping one bar means the
   change of screen is something the bar *does* rather than
   something that happens to it.

   Above 600 nothing here applies: the rail is a rail, the
   planners are their own documents, and a link is a link.
   ══════════════════════════════════════════════════════════ */

/* ---------- motion ----------
   The reference's own table, name for name. Spatial moves may
   overshoot; opacity and colour may not. Exits are shorter than
   entrances and accelerate away.

   Prefixed, because a planner mounted into this document brings
   its own --effects, --spring and --ease to the root and the two
   sets would otherwise fight over the same three names. */
:root{
  --nt-spatial: 440ms cubic-bezier(.32,1.24,.30,1);
  --nt-elastic: 520ms cubic-bezier(.30,1.62,.36,1);
  --nt-effects: 180ms cubic-bezier(.34,.80,.34,1);
  --nt-exit:    180ms cubic-bezier(.4,0,1,1);
  /* The bar reflows text, so its width must not overshoot: a spring
     here bounces the column narrower than its final size and
     "Programme" flickers into an ellipsis and back. Emphasised
     easing, no overshoot. Springs stay on things that only move. */
  --nt-resize:  440ms cubic-bezier(.2,0,0,1);
  --nt-stagger: 28ms;
  --nt-lab: 11px;
}

/* ---------- screens ----------
   Not the reference's absolutely-positioned pages. This document's
   list screen has a sticky masthead, a sticky calendar header and
   three observers that all read the window's own scroll; a planner
   expects to be a document too. So exactly one screen is in flow
   at a time and the window keeps scrolling the way both were
   written for. Each remembers where it was. */
.shell-page[hidden]{display:none}
.shell-page{
  transition: opacity var(--nt-effects), transform var(--nt-spatial);
  transform-origin: 50% 42%;
}
.shell-page.is-out{opacity:0;transform:scale(.97)}
.shell-page.is-in{opacity:0;transform:scale(1.03)}
/* Nothing may be pressed while a screen is on its way out. */
body.shell-busy .shell-page{pointer-events:none}

@media(min-width:600px){
  /* The shell is the phone's. A wide screen keeps the rail, the
     documents and the links they always had. */
  .dock{display:none!important}
}

@media(max-width:599.98px){
  /* The old bar steps aside for the dock, and stays aside: the drawer it used
     to become is gone, and the fourth cell opens the settings card instead. */
  .mnav{display:none}

  /* ---------- the dock ----------
     Back button and bar share one grid. Animating the grid's first
     column is what makes the bar give up width — nothing is
     repositioned by hand, and the bar never has to know the button
     exists. The span is the bar's own: min(94vw,430px), centred,
     16px of air beneath it. */
  .dock{
    position:fixed; z-index:60;
    inset-inline:calc(50% - min(94vw,430px) / 2);
    inset-block-end:calc(16px + var(--safe-b));
    display:grid; grid-template-columns:0px minmax(0,1fr); column-gap:0px;
    transform:translateY(var(--vvshift,0px));
    transition:grid-template-columns var(--nt-resize), column-gap var(--nt-resize);
  }
  .dock[data-deep]{grid-template-columns:64px minmax(0,1fr);column-gap:8px}

  .dock .glass{
    background:color-mix(in srgb,var(--md-sys-color-surface-container-low) 88%,transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 60%,transparent);
    box-shadow:0 10px 32px color-mix(in srgb,var(--md-sys-color-scrim) 16%,transparent);
    border-radius:var(--md-sys-shape-corner-extra-large);
  }

  /* --- the back button: a bubble, not a slide --- */
  .dock .back{
    grid-column:1;block-size:64px;min-inline-size:0;
    display:grid;place-items:center;padding:0;
    color:var(--md-sys-color-on-surface-variant);cursor:pointer;overflow:hidden;
    transform:scale(.2);opacity:0;
    transition:transform var(--nt-exit),opacity var(--nt-exit);
  }
  .dock .back svg{inline-size:24px;block-size:24px;fill:currentColor;stroke:none}
  .dock[data-deep] .back{
    transform:scale(1);opacity:1;
    /* it may only land once the space exists, so it waits */
    transition:transform var(--nt-elastic) 120ms,opacity var(--nt-effects) 120ms;
  }
  .dock .back:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}

  /* --- the bar --- */
  .dock .bar{grid-column:2;block-size:64px;padding:6px;min-inline-size:0;
    transition:block-size var(--nt-resize)}
  /* --- out of the way while you are reading down the page ---
     The planner's own rule, on the planner's own signal: past a dozen pixels
     and still moving down, the bar gives up its labels and the height they
     took; a nudge back up brings them straight back. A destination that is
     56dp of glyph is still a destination, and the page under it gets 16dp it
     did not have. */
  body.nav-min .dock .bar{block-size:48px}
  body.nav-min .dock .back{block-size:48px}
  body.nav-min .dock .dest{gap:0}
  body.nav-min .dock .dest__lab{
    block-size:0;opacity:0;overflow:hidden;
    transition:opacity var(--nt-exit),block-size var(--nt-resize)}
  /* The indicator mirrors a destination's own stack — glyph box, gap, a
     spacer standing in for the label — which is what lands it on the icon
     without an offset to retune. So it has to lose the same two things at the
     same moment: left as they were, the pill kept a 3px gap and a label's
     worth of height the cell no longer had, and sat that far above the glyph
     it is meant to be behind. */
  body.nav-min .dock .pill{gap:0}
  body.nav-min .dock .pill span{block-size:0}
  .dock .dest__lab{block-size:auto;transition:opacity var(--nt-effects),
    block-size var(--nt-resize)}
  /* The track is the destination row itself, so the indicator is
     positioned against it directly — no allowance for the bar's
     padding and no column gap to throw the arithmetic off. */
  .dock .track{position:relative;block-size:100%}
  .dock .dests{
    position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    block-size:100%;margin:0;padding:0;list-style:none;
  }
  .dock .dests li{display:grid;min-inline-size:0}
  /* the button must fill its cell, or it shrinks to its content and
     sits top-left of the slot the indicator is measuring */
  .dock .dest{
    position:relative;z-index:1;inline-size:100%;block-size:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;border-radius:22px;padding:0;min-inline-size:0;
    color:var(--md-sys-color-on-surface-variant);font-family:inherit;
    font-size:var(--nt-lab);font-weight:var(--md-sys-typescale-label-weight);line-height:1;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .dock .dest:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:-2px}
  .dock .dest__ico{display:grid;place-items:center;inline-size:54px;block-size:30px}
  .dock .dest__ico svg{inline-size:24px;block-size:24px}
  .dock .dest__lab{max-inline-size:100%;padding-inline:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the bar is 72dp narrower once the back button is out, so the
     labels step down a size — it changes while they are invisible,
     mid-swap */
  .dock[data-deep]{--nt-lab:10.5px}
  .dock .dest.is-current{color:var(--md-sys-color-on-secondary-container);font-weight:600}
  .dock .dest[aria-disabled=true]{opacity:.38}

  /* The glyph and label only cross-fade. They must not translate:
     the slots are already sliding horizontally as the bar narrows,
     and a vertical offset on top of that sends every icon along a
     diagonal — four diagonals at four different stagger delays,
     which is what reads as disorganised. Fade in place, let the
     layout do the moving. */
  .dock .dest__ico,.dock .dest__lab{
    transition:opacity var(--nt-effects) calc(var(--i) * var(--nt-stagger));
  }
  .dock .dests.is-swapping .dest__ico,.dock .dests.is-swapping .dest__lab{
    opacity:0;transition:opacity var(--nt-exit) calc(var(--i) * var(--nt-stagger));
  }
  .dock .dests.is-entering .dest__ico,.dock .dests.is-entering .dest__lab{
    opacity:0;transition:none;
  }

  /* --- the active indicator ---
     Sized in percent so it tracks the bar as the bar narrows: no
     measuring, no resize listener. It mirrors a destination's own
     stack — glyph box, gap, label-height spacer, centred — so it
     lands on the icon by construction rather than by an offset that
     has to be retuned whenever the label size changes. One slot is
     exactly 100% of the indicator's own width, so the index move is
     a transform; the width and the offset stay layout-driven and
     untransitioned, because transitioning a percentage of a box
     that is itself resizing makes the indicator chase a moving
     target and lag behind the icons. */
  .dock .pill{
    position:absolute;z-index:0;inset-block:0;inset-inline-start:0;
    inline-size:calc(100% / var(--n,4));
    transform:translateX(calc(var(--idx,0) * 100%));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    pointer-events:none;
    transition:transform var(--nt-spatial);
  }
  .dock .pill i{display:block;inline-size:54px;block-size:30px;
    border-radius:var(--md-sys-shape-corner-large);background:var(--md-sys-color-secondary-container)}
  .dock .pill span{display:block;block-size:var(--nt-lab)}

  /* A planner keeps its own dock, untouched. Substituting the shell's took
     the day switcher, the star filter, the funnel and the weather pill with
     it, and left the control card above sitting on nothing. The shell's dock
     is the list's; it stands down while a planner is up. */
  body.shell-deep .dock{opacity:0;pointer-events:none;
    transition:opacity var(--nt-exit)}
  /* The list's whole column steps aside — the header, the cards, the footer
     and the wave that divides them. `.wrap` itself, not its children: an <hr>
     inside it was slipping through a child selector and drawing a line across
     the planner. The drawer and its scrim are lifted out of it while they are
     open, because More belongs to both screens. */
  body.shell-deep .wrap{display:none}
  /* The dot grid is the list's weave. A planner brings its own ground. */
  body.shell-deep::before{opacity:0}
  /* The planner's own paper and ink, named rather than copied. This used to
     read `--pl-wash`, an inline custom property the mount wrote by resolving
     `--wash` once — and a literal in an inline property cannot re-resolve, so
     the screen kept the ground of whichever theme it was first mounted under.
     Switching dark to light afterwards then gave the worst of both: the shell
     put the list's near-black ink on the body while the screen kept its
     near-black ground, and the planner was black on black. The scoped blocks
     already declare both tokens on the screen element in each theme, so
     reading them here follows the switch. */
  .shell-page[data-planner]{background:var(--wash,var(--md-sys-color-surface));
    color:var(--on,var(--md-sys-color-on-surface))}
}

/* ---------- what the list says to the whole document ----------
   Sharing a document means the list's global rules reach into a planner,
   which never had them. Two of them are visible on a phone and only on a
   phone, which is why neither showed up in a desktop browser.

   The touch-target rule is the one that did the damage: the list sets a 48dp
   minimum height on every button, because M3 asks for a 48dp target around a
   40dp state layer. A planner's star on a cell is a 28px circle. 28 wide by
   48 tall is not a circle — it is the vertical ellipse that appeared on every
   one of them, on the masthead's discs, and anywhere else the design draws a
   round control. A planner sizes its own targets; the minimum stops at its
   edge.

   The hyperlink rule is the second: "for hyperlinked text appearing on top of
   a surface color, use primary… hyperlinks must also be underlined" is the
   list's reading of the type guidance, and `p a` is broad enough to catch an
   act's biography. */
@media(pointer:coarse){
  .shell-page[data-planner] button,
  .shell-page[data-planner] [role=button]{min-height:0}
}
.shell-page[data-planner] p a{color:inherit;text-decoration:none}

@media(prefers-reduced-motion:reduce){
  .dock,.dock .back,.dock .pill,.dock .dest__ico,.dock .dest__lab,.shell-page{
    transition-duration:1ms!important}
}
</style>

<div class="dock" id="dock" hidden>
  <button class="back glass" id="dockBack" type="button" aria-label="Go back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20z"/>
    </svg>
  </button>
  <!-- Not "Main": a planner mounted into this document labels its own bar
       that, and two navigations under one name is both a duplicate for a
       screen reader and a trap for anything that looks a bar up by it. -->
  <nav class="bar glass" aria-label="Festivals, plan and more">
    <div class="track">
      <span class="pill" aria-hidden="true"><i></i><span></span></span>
      <ul class="dests" id="dockDests"></ul>
    </div>
  </nav>
</div>
<!-- The shell always has the last word: a planner's stylesheet writes three
     rules on the document itself — body colour, body font, link colour — and
     inside this document those would reach the list screen too. This element
     is re-appended after every stylesheet the shell injects. -->
<style id="shellLastWord"></style>

<script>
(() => {
  const dock = document.getElementById('dock');
  if (!dock) return;
  const dests = document.getElementById('dockDests');
  const pill = dock.querySelector('.pill');
  const backBtn = document.getElementById('dockBack');
  const lastWord = document.getElementById('shellLastWord');
  const phone = () => matchMedia('(max-width: 599.98px)').matches;

  /* Where the site is, from the one link every page carries. */
  const manifest = document.querySelector('link[rel=manifest]');
  const BASE = manifest
    ? new URL(manifest.getAttribute('href'), location.href).href.replace(/manifest\.webmanifest$/, '')
    : new URL('./', location.href).href;

  /* ── the screens ──────────────────────────────────────
     The list is markup that is already here; a planner is a screen
     with nothing in it until the first time it is asked for. */
  const screens = {
    home: {el: document.getElementById('pHome'), scroll: 0, title: document.title, url: BASE},
  };
  /* The planner directories, in the order the records list them. The screen
     each one mounts into is empty markup this page already carries, written by
     the same builder off the same list. */
  const PLANNERS = __PLANNERS__;
  const screenId = (key) => 'p' + key[0].toUpperCase() + key.slice(1);
  let current = 'home', busy = false;

  const ICONS = {
    home: '<svg viewBox="0 0 96 96" aria-hidden="true"><use href="#h-i-logo"/></svg>',
    fest: '<svg class="i" aria-hidden="true"><use href="#h-i-ticket"/></svg>',
    plan: '<svg class="i" aria-hidden="true"><use href="#h-i-star-sq"/></svg>',
    more: '<svg class="i" aria-hidden="true"><use href="#h-i-more"/></svg>',
  };

  /* The list's own four, wired to the buttons the page already had —
     the dock draws them, the old bar's handlers still run them. */
  const relay = (id) => () => { const b = document.getElementById(id); if (b) b.click(); };
  const HOME_SET = () => ({
    current: homeIndex(),
    items: [
      {html: ICONS.home, label: 'Home', run: relay('nTop')},
      {html: ICONS.fest, label: 'Festivals', run: relay('nFest')},
      /* Keyed, so a page can find this cell to hang a count on it. */
      {html: ICONS.plan, label: 'My plan', key: 'plan', run: relay('nPlan')},
      {html: ICONS.more, label: 'More', run: relay('nMore')},
    ],
  });
  const homeIndex = () => {
    const on = document.querySelector('.mnav .railnav button.on');
    if (!on) return 0;
    return [...document.querySelectorAll('.mnav .railnav button')].indexOf(on);
  };

  /* ── painting the bar ─────────────────────────────────
     The reference's own: the row is rebuilt, each cell carries its
     index so the stagger is a delay multiplier, and the indicator is
     told how many slots there are and which one is live. */
  let liveSet = null;
  function paint(set) {
    liveSet = set;
    dests.innerHTML = set.items.map((d, i) =>
      '<li style="--i:' + i + '"><button class="dest' + (i === set.current ? ' is-current' : '') +
      '" type="button" style="--i:' + i + '"' +
      (i === set.current ? ' aria-current="page"' : '') +
      (d.disabled ? ' aria-disabled="true"' : '') +
      (d.key ? ' data-dest="' + d.key + '"' : '') + '>' +
      '<span class="dest__ico">' + d.html + '</span>' +
      '<span class="dest__lab">' + d.label + '</span></button></li>').join('');
    [...dests.querySelectorAll('.dest')].forEach((b, i) => {
      b.addEventListener('click', () => {
        const item = liveSet.items[i];
        if (!item || item.disabled) return;
        item.run();
        setCurrent(i);
      });
    });
    pill.style.setProperty('--n', set.items.length);
    pill.style.setProperty('--idx', set.current);
  }
  function setCurrent(i) {
    if (!liveSet || i < 0 || i === liveSet.current) return;
    liveSet.current = i;
    [...dests.querySelectorAll('.dest')].forEach((b, n) => {
      b.classList.toggle('is-current', n === i);
      if (n === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    pill.style.setProperty('--idx', i);
  }

  /* Out, staggered; swap while invisible; back in from nothing. */
  function swapDestinations(getSet) {
    dests.classList.add('is-swapping');
    const land = (set) => {
      paint(set);
      dests.classList.remove('is-swapping');
      dests.classList.add('is-entering');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        dests.classList.remove('is-entering');
      }));
    };
    setTimeout(() => {
      /* React has not necessarily painted the planner's own bar by the time
         the row is due back, so the row waits with its cells still empty
         rather than coming back holding nothing. */
      let tries = 0;
      const tick = () => {
        const set = typeof getSet === 'function' ? getSet() : getSet;
        if (set && set.items.length) return land(set);
        if (++tries > 60) return land({current: 0, items: []});
        setTimeout(tick, 50);
      };
      tick();
    }, 180 + 3 * 28);
  }

  function crossfade(from, to, forward) {
    from.classList.add(forward ? 'is-out' : 'is-in');
    setTimeout(() => {
      from.hidden = true;
      from.classList.remove('is-out', 'is-in');
      to.hidden = false;
      to.classList.add(forward ? 'is-in' : 'is-out');
      requestAnimationFrame(() => requestAnimationFrame(() =>
        to.classList.remove('is-in', 'is-out')));
    }, 180);
  }

  /* ── loading a planner ────────────────────────────────
     The four shared libraries, once, on the first planner asked for.
     Then the document is fetched, its stylesheet adopted, and its
     <x-dc> and logic script moved into the screen — which is all the
     runtime needs to compile and mount it where it stands. */
  let libs = null;
  const got = new Set();
  const loadScript = (src) => got.has(src) ? Promise.resolve() : new Promise((res, rej) => {
    got.add(src);
    const s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = () => res(); s.onerror = () => { got.delete(src); rej(new Error('load ' + src)); };
    document.head.appendChild(s);
  });
  /* Resolved against the site root rather than against the document, because
     by the time these are asked for the address is already the planner's and
     a relative src would go looking under /flow/. */
  const LIBS = __LIBS__.map((f) => new URL(f, BASE).href);
  function ensureLibs() {
    if (!libs) libs = (async () => { for (const f of LIBS) await loadScript(f); })();
    return libs;
  }

  /* The shell restates what a planner's stylesheet says about the document
     itself, so those three rules stop at the planner. */
  /* The face is read once, before any planner's stylesheet is in the document:
     read later and the body would already be answering in the planner's own,
     and the list would be handed Inter. The colours are NOT read — they are
     named. Read, they were a snapshot of whichever theme happened to be on at
     load, written into the one stylesheet that is always appended last and so
     always wins: open a planner in the light theme, come back, switch to dark,
     and the page stayed white under a scheme that had gone black. That is the
     "some components do not switch back" — it was the body itself, and it only
     started once a planner had been opened, which is what made it look random.
     Named, they resolve against the list's own tokens, which is what the theme
     switch moves. A planner's own `:root` blocks are scoped to its screen when
     it is mounted, so `:root` here is still the list's. */
  const own = { font: getComputedStyle(document.body).fontFamily };
  const INK = 'var(--md-sys-color-on-surface)';
  const PAPER = 'var(--md-sys-color-surface)';
  function reassertShell() {
    lastWord.textContent =
      /* Colour and face on the list's own screen. On the document they were
         reaching a planner too, which sets Inter and was getting the list's
         face instead. The ground stays on the document, because that is what
         shows through a screen that has not painted yet. */
      '#pHome{color:' + INK + ';font-family:' + own.font + '}' +
      'body{color:' + INK + ';background:' + PAPER +
      ';font-family:' + own.font + '}' +
      '#pHome a{color:inherit}' +
      'html,body{height:auto}';
    document.head.appendChild(lastWord);   /* always last */
  }

  /* Every mounted planner's own data, by key — see the note where it is set. */
  const FPS = window.__FP_BY__ = window.__FP_BY__ || {};

  async function mountPlanner(key, href) {
    const el = document.getElementById(screenId(key));
    if (!el) throw new Error('planner ' + key + ': no screen to mount into');
    if (el.dataset.mounted) return el;
    await ensureLibs();
    const html = await (await fetch(href, {credentials: 'same-origin'})).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const xdc = doc.querySelector('x-dc');
    /* The two files a planner is made of, named on the page rather than
       guessed at: the design, which every planner shares, and the festival's
       own values. This used to lift the compiled element straight out of the
       fetched document — and the day the component moved into a file of its
       own that element stopped existing, so what a phone got on pressing a
       festival was a blank screen under the dock. It is built here now, the
       same way the planner's own page builds it. */
    const code = doc.getElementById('fp-code');
    const data = doc.getElementById('fp-data');
    const props = doc.querySelector('meta[name="fp-props"]');
    if (!xdc || !code || !data) {
      throw new Error('planner ' + key + ': nothing to mount');
    }

    /* A planner writes its scheme on :root. Two of them in one document and
       the second would repaint the first — and the list with it. Each one's
       root blocks are re-pointed at its own screen instead; the theme
       attribute stays where it is, on the document, so a light and a dark
       rule still read the same switch. */
    const scopeId = '#' + el.id;
    /* `:root` cannot appear in a declaration value, so these are plain
       substitutions rather than a parse. The theme-qualified forms go first,
       because the switch stays on the document and only the scope moves. */
    const DARK = /\[data-theme=("|')dark\1\]/;
    const scoped = (css) => css
      .replace(/:root:not\(\[data-theme=("|')dark\1\]\)/g,
        'html:not([data-theme="dark"]) ' + scopeId)
      .replace(/:root\[data-theme=("|')dark\1\]/g,
        'html[data-theme="dark"] ' + scopeId)
      .replace(/(^|[},])(\s*)\[data-theme=("|')dark\3\](?=\s*[{,])/g,
        (m, a, b2) => a + b2 + 'html[data-theme="dark"] ' + scopeId)
      .replace(/:root/g, scopeId);
    for (const s of doc.head.querySelectorAll('style')) {
      const c = document.createElement('style');
      c.dataset.planner = key;
      c.textContent = scoped(s.textContent);
      document.head.appendChild(c);
    }
    /* The face a planner sets on the document, taken off the document and put
       on its own screen — read rather than written down, so it is whatever
       the design asks for. The list keeps its own; everything outside a
       screen, the dock and the drawer, keeps the list's too. */
    el.style.fontFamily = getComputedStyle(document.body).fontFamily;
    reassertShell();

    el.dataset.planner = key;
    el.appendChild(document.importNode(xdc, true));
    /* The design once, whichever planner asks for it first; then this
       festival's own values, which the data file leaves on two globals. */
    await loadScript(new URL(code.getAttribute('src'), href).href);
    await loadScript(new URL(data.getAttribute('src'), href).href);
    /* Kept under its own name, because `FP` is one global and a second planner
       mounted into this document would take it from the first — which nobody
       would see until they went back to a planner they had already opened and
       found another festival's dates in it. Each one closes over its own. */
    FPS[key] = window.__FP_DATA__;
    const s2 = document.createElement('script');
    s2.type = 'text/x-dc';
    s2.setAttribute('data-dc-script', '');
    s2.setAttribute('data-props', props ? props.getAttribute('content') : '');
    /* One declaration in front of the component, so every `FP` inside it is
       this festival's. The runtime compiles the whole thing as one function
       body, so a `const` at the top of it shadows the global for all of it. */
    s2.textContent = 'const FP = window.__FP_BY__[' + JSON.stringify(key) + '];\n'
      + window.__FP_SRC__;
    el.appendChild(s2);

    /* The runtime names its root from the address, so the URL is
       already the planner's by the time it boots — which also makes
       the raw-template refetch it does hit the right document. */
    window.__dcBoot();
    /* Its own full-page rule would clamp this document's height. */
    for (const s of document.head.querySelectorAll('style')) {
      if (s.textContent.indexOf('#dc-root,#dc-root>.sc-host{height:100%}') === 0 ||
          /^html,body\{height:100%;margin:0\}/.test(s.textContent)) s.remove();
    }
    reassertShell();
    el.dataset.mounted = '1';
    const t = doc.querySelector('title');
    if (screens[key] && t) screens[key].title = t.textContent;
    return el;
  }

  /* A planner's own bar, read rather than reinvented: its labels, its
     glyphs and which one is lit. The shell's cells press its buttons,
     so nothing about how a planner switches view changes. */
  function plannerSet(el) {
    const nav = el.querySelector('nav[aria-label="Main"]');
    if (!nav) return null;   /* the planner's, inside its own screen */
    const btns = [...nav.querySelectorAll('button')];
    if (!btns.length) return null;
    const lit = btns.findIndex(b => b.getAttribute('aria-current') === 'page' ||
      b.getAttribute('aria-selected') === 'true');
    return {
      current: lit < 0 ? 0 : lit,
      items: btns.map((b) => {
        const svg = b.querySelector('svg');
        const lab = b.lastElementChild;
        return {
          html: svg ? svg.outerHTML : '',
          label: (lab && lab.textContent || '').trim(),
          run: () => b.click(),
        };
      }),
    };
  }

  /* ── the move ─────────────────────────────────────────
     Three things at once, in the reference's order: the bar gives up
     width on its leading edge, the back button springs into what it
     left 120ms later, and the destinations swap while the screens
     cross-fade. */
  async function go(key, href, push) {
    if (busy || key === current) return;
    busy = true;
    document.body.classList.add('shell-busy');
    const forward = key !== 'home';
    const from = screens[current].el;

    screens[current].scroll = window.scrollY;
    if (forward) {
      dock.toggleAttribute('data-deep', true);
      let el = document.getElementById(screenId(key));
      screens[key] = screens[key] || {el, scroll: 0, title: document.title, url: href};
      screens[key].el = el;
      /* The address comes first. The runtime names its root from the path and
         re-reads the raw template from location.href, so booting a planner at
         the list's URL compiles it as the list and fetches the wrong
         document — which is what "logic class eval FAILED for index" was. */
      if (push) { history.pushState({screen: key}, '', href); push = false; }
      if (!el.dataset.mounted) {
        try { el = screens[key].el = await mountPlanner(key, href); }
        catch (e) { console.error('[shell]', e); location.href = href; return; }
      }
      swapDestinations(() => plannerSet(el));
      crossfade(from, el, true);
      /* A planner mounts once and is kept, so the second visit to the same
         festival is a screen that has already decided what it is showing. The
         address has changed under it — a link out of My plan asks for the
         picks — and `pushState` fires nothing, so it is told. Harmless on a
         first mount, which read the same address itself. */
      dispatchEvent(new CustomEvent('fp:open', {detail: {key: key}}));
      document.body.classList.add('shell-deep');
      watch(el);
    } else {
      dock.toggleAttribute('data-deep', false);
      swapDestinations(HOME_SET);
      crossfade(from, screens.home.el, false);
      document.body.classList.remove('shell-deep');
      unwatch();
    }
    current = key;
    if (push) history.pushState({screen: key}, '', screens[key] ? screens[key].url : BASE);
    document.title = screens[key] ? screens[key].title : screens.home.title;
    setTimeout(() => {
      window.scrollTo(0, screens[key] ? screens[key].scroll : 0);
      busy = false;
      document.body.classList.remove('shell-busy');
    }, 200);
  }

  /* The planner moves its own indicator when something inside it
     changes view — a card's See all, a deep link, the back gesture —
     so the dock follows its bar rather than assuming it led. */
  let mo = null;
  function watch(el) {
    unwatch();
    const nav = el.querySelector('nav[aria-label="Main"]');
    if (!nav) return;
    mo = new MutationObserver(() => {
      const btns = [...nav.querySelectorAll('button')];
      const lit = btns.findIndex(b => b.getAttribute('aria-current') === 'page' ||
        b.getAttribute('aria-selected') === 'true');
      if (lit >= 0) setCurrent(lit);
    });
    mo.observe(nav, {subtree: true, attributes: true,
      attributeFilter: ['aria-current', 'aria-selected', 'class']});
  }
  function unwatch() { if (mo) { mo.disconnect(); mo = null; } }

  /* ── wiring ───────────────────────────────────────────
     A card still carries a real href, so it is a link on a wide
     screen, to a crawler, and on a middle click. On a phone the
     shell takes the press instead. */
  const plannerAt = (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    let href = a && a.target !== '_blank' ? a.href : null;
    if (!href) {
      /* The whole card is a target, not only its words, and the page opens
         that one by assignment rather than by following a link. */
      const card = e.target.closest && e.target.closest('.card[data-planner]');
      if (card && !e.target.closest('a,button,.plan-toggle,.btn-group')) {
        href = new URL(card.dataset.planner, location.href).href;
      }
    }
    if (!href) return null;
    const u = new URL(href, location.href);
    if (!u.href.startsWith(BASE)) return null;
    /* Every planner the site publishes, written by the build rather than
       listed here — the two this shell was born with stayed in a regular
       expression through five more being added, and the five it did not name
       quietly fell through to a document navigation on a phone: the same page,
       without the shell that is the whole reason the phone feels the way it
       does. The path is matched without the fragment, because a link into
       someone's picks carries one and it is the planner's to read. */
    const rel = u.href.slice(BASE.length).replace(/index\.html$/, '').replace(/#.*$/, '');
    const key = PLANNERS.find((p) => rel === p + '/');
    if (!key) return null;
    /* One planner at a time. The runtime names its root off the address —
       every planner's path ends in a slash, so every one of them is called
       `Root` — and it keeps one component under a name and one element at
       `#dc-root`. A second planner mounted beside the first takes both: the
       screen you opened before would be redrawn as the festival you opened
       after, which is a worse answer than a page load. So the shell takes the
       press for the planner it is already holding, and lets any other one be
       the link it already is — which is what every width above 600px does with
       all of them anyway. */
    const busy = [...document.querySelectorAll('.shell-page[data-mounted]')]
      .find((el) => el.id !== screenId(key));
    if (busy) return null;
    return {key: key, href: u.href};
  };

  /* Capture, and stop there. preventDefault is not enough on its own: the
     card's own handler navigates by assigning location, and the page-effects
     layer would arm its loading skeleton for a document that is never going
     to be fetched. Neither may run once the shell has taken the press. */
  document.addEventListener('click', (e) => {
    if (!phone()) return;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const hit = plannerAt(e);
    if (!hit) return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    go(hit.key, hit.href, true);
  }, true);

  backBtn.addEventListener('click', () => { history.back(); });

  addEventListener('popstate', (e) => {
    const key = (e.state && e.state.screen) || 'home';
    if (key === current) return;
    go(key, screens[key] ? screens[key].url : BASE, false);
  });

  /* The dock is the phone's bar, so it appears with the breakpoint
     and the old one steps aside underneath it. */
  const sync = () => {
    dock.hidden = !phone();
    if (phone() && !dests.children.length) paint(HOME_SET());
  };
  matchMedia('(max-width: 599.98px)').addEventListener('change', sync);
  sync();
  history.replaceState({screen: 'home'}, '', location.href);

  /* The list's own bar still runs its views; the dock mirrors which
     one is lit so pressing either keeps them in step. */
  new MutationObserver(() => {
    if (current === 'home') setCurrent(homeIndex());
  }).observe(document.querySelector('.mnav .railnav'),
    {subtree: true, attributes: true, attributeFilter: ['class']});
})();
</script>
